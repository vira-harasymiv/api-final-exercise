name: run API  Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url-options:
        description: "URL of the API to test"
        required: true
        default: "http://localhost:3000"
        type: choice
        options:
          - "http://localhost:3000"
          - "https://api.example.com"
      url:
        description: "URL of the API to test"
        required: true
        default: "http://localhost:3000"
        type: string

      isReportNeeded:
        description: "URL of the API to test"
        required: true
        default: true
        type: boolean

      workerCount:
        description: "How many workers to use to test"
        required: true
        default: 3
        type: number

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --workers=${{github.event.inputs.workerCount}}
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
