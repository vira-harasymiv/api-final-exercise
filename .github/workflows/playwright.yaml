name: api tests

# Тригер: ручний запуск через GitHub UI або API.
# Дозволяє передати URL цільового API і кількість паралельних воркерів
# без зміни коду воркфлоу — зручно для запуску тестів на різних оточеннях.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the API to test"
        required: true
        default: "http://localhost:3000"
        type: string

      workersCount:
        description: "How many workers to use for testing"
        required: true
        default: 3
        type: number

# Мінімальні права, необхідні для публікації звіту на GitHub Pages:
# pages + id-token — для деплою артефакту на Pages;
# contents: read — для checkout репозиторію.
permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  test:
    # Змінні середовища, які потрібні серверу і тестам під час виконання джобу.
    # DATABASE_URL / UPLOAD_DIR зберігаються як Variables (не секрети), JWT_SECRET — як Secret.
    # BASE_URL береться з вхідного параметра воркфлоу, щоб тести знали, куди робити запити.
    env:
      DATABASE_URL: "mysql://root:Roman7952470!@localhost:3306/dojo_api"
      JWT_SECRET: "8f3a1c9e4b7d2f6a0e5c8b1d4f7a2e9c6b3d0f8a5e2c9b6d3f0a7e4c1b8d5f2a"
      UPLOAD_DIR: "/tmp/dojo-api-uploads"
      BASE_URL: "http://localhost:3000"

    # Обмежує час виконання джобу 60 хвилинами, щоб уникнути нескінченного зависання
    # і зайвого витрачання хвилин GitHub Actions.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # Клонує поточну гілку репозиторію в runner, щоб мати доступ до коду і конфігів.
      - uses: actions/checkout@v5

      # Встановлює точну версію Node.js, щоб середовище виконання збігалося з локальним
      # і уникати несподіваних розбіжностей у поведінці пакетів.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.1

      # Підіймає локальний сервер MySQL на runner — потрібен для підключення бекенду до бази даних
      # під час виконання тестів без залежності від зовнішньої бази.
      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "9.6.0"

      # Швидка перевірка, що MySQL дійсно стартував і відповідає на запити перед продовженням.
      - run: mysql -uroot -e 'SELECT version()'

      # Кешує завантажені npm-пакети між запусками, щоб не завантажувати їх щоразу наново
      # і скоротити час виконання воркфлоу. Ключ залежить від package-lock.json —
      # кеш інвалідується автоматично при зміні залежностей.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # Встановлює всі залежності проекту (включно з dev-залежностями для тестів і Playwright).
      - name: Install dependencies
        run: npm install

      # Синхронізує схему Prisma з базою даних — створює або оновлює таблиці
      # відповідно до поточних моделей без застосування міграцій.
      - name: Push schema to database
        run: npm run db:push

      # Наповнює базу даних початковими тестовими даними, необхідними для коректної роботи тестів.
      - name: Seed sample data
        run: npm run db:seed

      # Запускає dev-сервер у фоновому режимі (&), щоб наступні кроки могли робити до нього запити.
      - name: Start development server
        run: npm run dev &

      # Чекає, поки сервер почне приймати запити на localhost:3000 (максимум 30 секунд),
      # щоб не запускати тести до того, як API готове відповідати.
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      # Запускає Playwright-тести з кількістю паралельних воркерів, переданою через параметр.
      # Більше воркерів — швидший запуск, але більше навантаження на локальний сервер і БД.
      - name: Run api tests
        run: npx playwright test --workers=${{ github.event.inputs.workersCount }}

      # Зберігає HTML-звіт Playwright як артефакт джобу навіть якщо тести впали (if: !cancelled()).
      # Зберігається 30 днів — достатньо для аналізу флапаючих тестів і розбору інцидентів.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Пакує той самий звіт у формат для GitHub Pages, щоб його можна було опублікувати
      # як статичний сайт і переглядати у браузері без завантаження ZIP-архіву.
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: playwright-report/
