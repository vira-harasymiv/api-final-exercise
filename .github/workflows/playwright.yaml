name: api tests

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the API to test"
        required: true
        default: "http://localhost:3000"
        type: string

      workersCount:
        description: "How many workers to use for testing"
        required: true
        default: 3
        type: number

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  test:
    env:
      DATABASE_URL: "mysql://root:Roman7952470!@localhost:3306/dojo_api"
      JWT_SECRET: "8f3a1c9e4b7d2f6a0e5c8b1d4f7a2e9c6b3d0f8a5e2c9b6d3f0a7e4c1b8d5f2a"
      UPLOAD_DIR: "/tmp/dojo-api-uploads"

    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.1

      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "9.6.0"

      - run: mysql -uroot -e 'SELECT version()'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Push schema to database
        run: npm run db:push

      - name: Seed sample data
        run: npm run db:seed

      - name: Start development server
        run: npm run dev

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run api tests
        run: npx playwright test --workers=${{ github.event.inputs.workersCount }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
